<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Application</title>
</head>
<body>
    <h1>Add an Internship Application</h1>

    <form method="post" action="/applications">

        <label for="company">Company</label><br>
        <input type="text" id="company" name="company" required><br><br>

        <label for="role">Role</label><br>
        <input type="text" id="role" name="role" required><br><br>

        <label for="status">Status</label><br>
        <select id="status" name="status" required>
            <option value="Applied">Applied</option>
            <option value="Online Assessment">Online Assessment</option>
            <option value="Interviewing">Interviewing</option>
            <option value="Offer">Offer</option>
            <option value="Rejected">Rejected</option>
        </select><br><br>

        <label for="dateApplied">Date Applied</label><br>
        <input type="date" id="dateApplied" name="dateApplied" required><br><br>

        <label for="followUpDate">Follow-up Date</label><br>
        <input type="date" id="followUpDate" name="followUpDate"><br><br>

        <button type="submit">Submit</button>
    </form>
</body>
</html>
